[mypy]
python_version = 3.11
mypy_path = $MYPY_CONFIG_FILE_DIR/typings:$MYPY_CONFIG_FILE_DIR
files = $MYPY_CONFIG_FILE_DIR/app, $MYPY_CONFIG_FILE_DIR/entry, $MYPY_CONFIG_FILE_DIR/runtime_controller
check_untyped_defs = True
show_error_codes = True
pretty = False
warn_unused_configs = True

# Check every production module. Do not exclude application code or suppress
# diagnostics to make the baseline green; resolve the diagnostics before
# enabling this command as a required CI gate.
#
# Third-party boundaries: SQLAlchemy (inline), docker (types-docker), pika
# (types-pika), pandas (pandas-stubs), PyMuPDF and pgvector (local declarations)
# are all checked. The Redis client contract lives in app/infra/extensions.py.
