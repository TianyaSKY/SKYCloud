services:
  db:
    image: pgvector/pgvector:pg15
    container_name: skycloud-db
    restart: always
    command: [ "postgres", "-c", "timezone=Asia/Shanghai" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skycloud-network

  redis:
    image: redis:7-alpine
    container_name: skycloud-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skycloud-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: skycloud-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-skycloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-skycloud}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skycloud-network

  minio:
    image: minio/minio:latest
    container_name: skycloud-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skycloud-network

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skycloud-backend-api
    restart: always
    command: python -m entry.api
    ports:
      - "${BACKEND_API_PORT}:5000"
    volumes:
      - ${UPLOAD_HOST_PATH}:/data/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-skycloud}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-skycloud}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-skycloud}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - UPLOAD_FOLDER=/data/uploads
      - OPENCODE_IMAGE=${OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:latest}
      - SKYCLOUD_DOCKER_NETWORK=${COMPOSE_PROJECT_NAME:-skycloud}_skycloud-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - skycloud-network

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skycloud-backend-consumer
    restart: always
    command: python -m entry.worker
    volumes:
      - ${UPLOAD_HOST_PATH}:/data/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-skycloud}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-skycloud}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-skycloud}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - UPLOAD_FOLDER=/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - skycloud-network

  backend-mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skycloud-backend-mcp
    restart: always
    command: python -m entry.mcp_run
    ports:
      - "${MCP_PORT:-5001}:5001"
    volumes:
      - ${UPLOAD_HOST_PATH}:/data/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-skycloud}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-skycloud}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-skycloud}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - UPLOAD_FOLDER=/data/uploads
      - MCP_PORT=5001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - skycloud-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skycloud-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend-api
    networks:
      - skycloud-network

networks:
  skycloud-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
