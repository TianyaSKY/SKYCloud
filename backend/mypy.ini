[mypy]
python_version = 3.11
mypy_path = $MYPY_CONFIG_FILE_DIR
files = $MYPY_CONFIG_FILE_DIR/app, $MYPY_CONFIG_FILE_DIR/entry, $MYPY_CONFIG_FILE_DIR/runtime_controller
check_untyped_defs = True
show_error_codes = True
pretty = False
warn_unused_configs = True

# Check every production module. Do not exclude application code or suppress
# diagnostics to make the baseline green; resolve the diagnostics before
# enabling this command as a required CI gate.
#
# Third-party boundaries: only packages that ship neither inline types nor a
# maintained stub distribution are listed below, so their untyped surface is a
# declared boundary instead of an implicit blind spot. Everything typed is
# checked: SQLAlchemy (inline), docker (types-docker), pika (types-pika),
# pandas (pandas-stubs) and the Redis client contract in app/infra/extensions.py.
[mypy-fitz.*]
ignore_missing_imports = True

[mypy-pgvector.*]
ignore_missing_imports = True
