map $http_upgrade $runtime_ui_connection {
    default upgrade;
    '' close;
}

limit_conn_zone $binary_remote_addr zone=api_connections:10m;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 512m;
    resolver 127.0.0.11 ipv6=off;

    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; frame-src 'self' blob: ${RUNTIME_UI_CSP_SOURCE}; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /mcp {
        client_max_body_size 32m;
        proxy_request_buffering off;
        set $mcp_upstream http://backend-mcp:5001;
        proxy_pass $mcp_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ^~ /runtime-ui {
        return 404;
    }

    location /api {
        limit_conn api_connections 8;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        set $backend_upstream http://backend-api:5000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Runtime pages use a different host for every runtime. This listener serves
# only the scoped UI gateway and never the parent application's files or API.
server {
    listen 8081;
    server_name ~^r[0-9]+\.skycloud\.localhost$;
    client_max_body_size 256k;
    resolver 127.0.0.11 ipv6=off;

    location / {
        set $runtime_ui_upstream http://backend-api:5000/runtime-ui;
        proxy_pass $runtime_ui_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $runtime_ui_connection;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    location = /__skycloud/launch {
        access_log off;
        set $runtime_ui_upstream http://backend-api:5000/runtime-ui;
        proxy_pass $runtime_ui_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
    }
}
