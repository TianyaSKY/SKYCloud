name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - name: Native libraries for real OpenCV imports
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-test.lock'
      - name: Validate GitHub Actions workflow
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml
      - run: python scripts/check-python-runtime.py
      - name: Regular backend suite
        working-directory: backend
        run: python -m pytest -o addopts='' --ignore=tests/real -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run audit
        working-directory: frontend
      - run: npm run lint:check
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  integration:
    name: PostgreSQL, RabbitMQ, MinIO and Controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-test.lock'
      - name: Build checksum-locked MinIO fixture
        run: |
          python - <<'PY'
          import os, runpy
          reference = runpy.run_path("scripts/build-minio-image.py")["build"]()
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write("SKYCLOUD_TEST_MINIO_IMAGE=" + reference + "\n")
          PY
      - name: Preload fixture images before their readiness deadlines
        run: |
          docker pull pgvector/pgvector:pg15
          docker pull rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
      - name: Build Controller and pin disposable cleanup fixture
        run: |
          docker build -t skycloud-ci-cleanup-controller -f backend/runtime_controller/Dockerfile backend
          fixture='redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499'
          docker pull "$fixture"
          reference=$(docker image inspect "$fixture" --format '{{.Id}}')
          echo "SKYCLOUD_TEST_RUNTIME_IMAGE=$reference" >> "$GITHUB_ENV"
          echo "SKYCLOUD_TEST_INFRA_IMAGE=$reference" >> "$GITHUB_ENV"
          echo "SKYCLOUD_TEST_CONTROLLER_IMAGE=skycloud-ci-cleanup-controller" >> "$GITHUB_ENV"
      - name: Migrations, delivery and crash recovery
        working-directory: backend
        env:
          RUN_MIGRATION_TESTS: '1'
          RUN_TASK_QUEUE_TESTS: '1'
          RUN_FILE_OUTBOX_TESTS: '1'
          RUN_ORGANIZE_TASK_TESTS: '1'
          RUN_TIME_BOUNDARY_TESTS: '1'
          RUN_UTC_MIGRATION_TESTS: '1'
          RUN_WORKSPACE_INSIGHTS_TESTS: '1'
          RUN_VECTOR_TESTS: '1'
          RUN_OBJECT_DELETION_TESTS: '1'
          RUN_CONTAINER_DELETION_TESTS: '1'
          RUN_WORKSPACE_LIST_TESTS: '1'
          RUN_FOLDER_TREE_TESTS: '1'
          RUN_SHARE_ACCESS_TESTS: '1'
          RUN_USAGE_DIAGNOSTIC_TESTS: '1'
          RUN_SERVER_DIAGNOSTIC_TESTS: '1'
          RUN_CACHE_AUDIT_DIAGNOSTICS: '1'
          RUN_CONTROLLER_DIAGNOSTICS: '1'
        run: >-
          python -m pytest -o addopts='' -q
          tests/integration/test_migrations.py
          tests/integration/test_generation_retirement.py
          tests/integration/test_assistant_lease.py
          tests/integration/test_permission_dispatch.py
          tests/integration/test_task_queue.py
          tests/integration/test_file_task_outbox.py
          tests/integration/test_organize_tasks.py
          tests/integration/test_time_boundaries.py
          tests/integration/test_utc_migration.py
          tests/integration/test_workspace_insights.py
          tests/integration/test_vector_retrieval.py
          tests/integration/test_file_object_deletion.py
          tests/integration/test_runtime_container_deletion.py
          tests/integration/test_workspace_runtime_list.py
          tests/integration/test_folder_tree.py
          tests/integration/test_share_access.py
          tests/integration/test_usage_diagnostics.py
          tests/integration/test_server_diagnostics.py
          tests/integration/test_cache_audit_diagnostics.py
          tests/integration/test_controller_diagnostics.py
      - name: Authenticated uploads, object recovery and indexing workflows
        working-directory: backend
        env:
          RUN_UPLOAD_STORAGE_TESTS: '1'
          RUN_INDEXING_PIPELINE_TESTS: '1'
          RUN_ORGANIZE_PIPELINE_TESTS: '1'
        run: >-
          python -m pytest -o addopts='' -q
          tests/integration/test_upload_storage.py
          tests/integration/test_indexing_pipeline.py
          tests/integration/test_organize_pipeline.py
      - name: Build locked OpenCode and gateway bridge fixture
        run: |
          python - <<'PY'
          import os, runpy
          reference = runpy.run_path("scripts/build-runtime-image.py")["build"]()
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write("SKYCLOUD_TEST_RUNTIME_IMAGE=" + reference + "\n")
          PY
          docker build -t skycloud-frontend:locked-test -f frontend/Dockerfile frontend
      - name: Actual OpenCode provisioning, process crash recovery and MCP
        working-directory: backend
        env:
          RUN_EXPERT_GATEWAY_TESTS: '1'
          RUN_RUNTIME_UI_TESTS: '1'
          RUN_REFRESH_SESSION_TESTS: '1'
        run: >-
          python -m pytest -o addopts='' -q
          tests/integration/test_expert_gateway.py
          tests/integration/test_runtime_ui_terminal.py
          tests/integration/test_refresh_sessions.py

  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: [backend, controller, frontend, runtime, minio]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and verify image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            backend)
              docker build -t skycloud-ci-backend backend
              docker run --rm --network none \
                -v "$PWD/scripts/check-python-runtime.py:/app/scripts/check-python-runtime.py:ro" \
                skycloud-ci-backend python /app/scripts/check-python-runtime.py
              ;;
            controller)
              docker build -t skycloud-ci-controller -f backend/runtime_controller/Dockerfile backend
              docker run --rm --network none \
                -e PYTHONPYCACHEPREFIX=/tmp/pycache \
                skycloud-ci-controller python -m compileall -q runtime_controller
              ;;
            frontend)
              docker build -t skycloud-ci-frontend frontend
              docker run --rm --network none skycloud-ci-frontend nginx -t
              ;;
            runtime) python3 scripts/build-runtime-image.py ;;
            minio) python3 scripts/build-minio-image.py ;;
            *) exit 1 ;;
          esac

  quality-gate:
    name: CI quality gate
    if: ${{ always() }}
    needs: [backend, frontend, integration, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success,success'
